# RPG Horizon: independent configuration and certificate on the shared HTTPS proxy.
proxy_cache_path /var/cache/nginx/rpghorizon levels=1:2 keys_zone=RPGHORIZON:4m
                 max_size=512m min_free=20g inactive=24h use_temp_path=off;
map "$upstream_status:$upstream_http_content_length:$upstream_http_content_type" $rpg_no_cache {
    default 1;
    "~^200:[0-9]{1,8}:(?!text/html)" 0;
}
map $uri $rpg_document {
    default 0;
    ~*(/|\.html?)$ 1;
    ~(^|/)[^/.]+$ 1;
}
limit_conn_zone $binary_remote_addr zone=RPG_CLIENT:1m;
map $server_name $rpg_pool { default rpghorizon; }
limit_conn_zone $rpg_pool zone=RPG_TOTAL:1m;
limit_req_zone $rpg_pool zone=RPG_RATE:1m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name rpghorizon.com www.rpghorizon.com;
    return 308 https://rpghorizon.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rpghorizon.com;
    ssl_certificate /etc/letsencrypt/live/rpghorizon-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpghorizon-com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != www.rpghorizon.com) { return 444; }
    if ($ssl_server_name != www.rpghorizon.com) { return 421; }
    return 308 https://rpghorizon.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rpghorizon.com;
    ssl_certificate /etc/letsencrypt/live/rpghorizon-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpghorizon-com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RPG_TLS:1m;
    ssl_session_tickets off;
    if ($host != rpghorizon.com) { return 444; }
    if ($ssl_server_name != rpghorizon.com) { return 421; }
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    limit_conn RPG_CLIENT 16;
    limit_conn RPG_TOTAL 32;
    limit_conn_status 503;
    limit_req zone=RPG_RATE burst=100 nodelay;
    limit_req_status 503;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 1;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/atom+xml;
    access_log /var/log/nginx/rpghorizon.access.log;
    error_log /var/log/nginx/rpghorizon.error.log warn;
    set $rpg_bucket_host rpghorizon-com-production-fr-par.s3-website.fr-par.scw.cloud;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $rpg_bucket_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name $rpg_bucket_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 3s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_max_temp_file_size 16m;
        proxy_cache RPGHORIZON;
        proxy_cache_key "$rpg_bucket_host$request_uri|$http_accept_encoding";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 60s;
        proxy_no_cache $rpg_document $rpg_no_cache $http_authorization $http_cookie $http_range;
        proxy_cache_bypass $rpg_document $http_authorization $http_cookie $http_range;
        proxy_cache_use_stale off;
        proxy_intercept_errors off;
        proxy_redirect https://$rpg_bucket_host/ https://rpghorizon.com/;
        proxy_redirect http://$rpg_bucket_host/ https://rpghorizon.com/;
        proxy_pass https://$rpg_bucket_host$request_uri;
    }
}
